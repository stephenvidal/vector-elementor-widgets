name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build dist ZIP and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build release artifacts (dist ZIP + source + checksums)
        run: bash tools/build.sh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
